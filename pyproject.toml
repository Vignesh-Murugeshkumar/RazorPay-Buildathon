[project]
name = "sentinel-dispute"
version = "1.0.0"
description = "Autonomous Visa CE 3.0 & Mastercard FPT Dispute Defense Engine for Razorpay"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.1.0",
    "langgraph>=0.0.26",
    "langchain-core>=0.1.28",
    "requests>=2.31.0",
    "anyio[asyncio]>=4.0.0",
    "httpx>=0.27.0",
    "structlog>=24.1.0",
    "psycopg[binary]>=3.1.0",
    "psycopg-pool>=3.2.0",
    "redis>=5.0.0",
    "gunicorn>=21.2.0",
]

[tool.vercel]
entrypoint = "api.index:app"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
